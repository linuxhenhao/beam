name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check Rust source file line count (max 1000)
        run: scripts/check-rust-line-count.sh
      - name: Check zero clippy warnings
        run: scripts/check-clippy.sh
      - run: cargo test --workspace --no-fail-fast
